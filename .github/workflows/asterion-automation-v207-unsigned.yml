name: Asterion v2.0.7 Unsigned Release for Stable Offline Signing

on:
  push:
    branches:
      - fix/automation-startup-dual-failure-20261023

jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build production release without a CI signing key
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload unsigned artifact for signing with existing permanent key
        uses: actions/upload-artifact@v4
        with:
          name: AsterionCore-v2.0.7-UNSIGNED
          path: android_app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
