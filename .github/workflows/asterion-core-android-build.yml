name: Asterion Core Android Build

concurrency:
  group: asterion-core-android-${{ github.ref }}-20261102
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - standalone-android
      - asterion-import-pass1
      - asterion-character-resolver-v1
      - feature/roundsync-terabox-cloud-browser-20261019
      - fix/terabox-model-import-staging-20261023
      - fix/android-automation-memory-budget-20261023
      - fix/persistent-android-release-signing-20261023
      - feature/asterion-batch-300k-20261023
      - fix/pin-asterion-update-signature-20261023
      - fix/release-only-apk-20261023
      - fix/automation-startup-dual-failure-20261023
      - fix/automation-memory-models-ui-v208-20261024
      - build/unsigned-production-artifact-20261023
      - fix/qwen-bitmap-bounds-and-image-input-20261024
      - fix/qwen-mtmd-native-prefill-v2010-20261024
      - fix/qwen-runtime-validation-v2011-20261027
      - fix/automation-integrity-hardening-20261030
      - fix/android17-automation-foreground-pending-20261101
      - fix/automation-inline-real-device-20261101
      - fix/automation-exclusive-memory-v2016-20261101
      - fix/production-automation-source-background-ai-20261102
      - fix/asterioncore-image-loading-background-and-integrity-20261102
      - fix/indexed-thumbnail-prewarm-automation-20261102
      - fix/aesthetic-admission-device-2136mib-20261102
      - fix/p0-asterioncore-source-pipeline-20261102
      - fix/p0-rounder-fingerprint-stream-20261102
      - fix/p0-review-preview-status-20261102
      - fix/p0-vision-automation-safety-20261102
      - fix/p0-fast-trash-taxonomy-20261102
      - fix/p0-fast-trash-taxonomy-validation-20261102
      - fix/p0-automation-ui-poll-and-diagnostics-20261102
      - fix/asterioncore-ux-bridge-performance-20261102
      - fix/asterioncore-qwen-automation-20261102
      - fix/core-native-taxonomy-fast-cancel-20261102
      - feature/core-fusion-native-gallery-20261108
      - feature/core-alternate-native-tagger-20261111
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests for signed release
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugUnitTestKotlin
          ./gradlew :app:testDebugUnitTest --stacktrace
          # Do not package debug APKs for distribution. The release job below
          # builds the only deliverable, using the permanently configured key.

      - name: Verify 300K image paging, bounded queries and checkpoint resumption
        run: python3 scripts/test_automation_300k_sqlite.py

      - name: Verify automation safety, retries and relocation invariants
        run: python3 scripts/test_android_automation_integrity.py

      - name: Verify gallery optimization, background recovery and relocation journaling
        run: python3 scripts/test_android_automation_optimization.py

      - name: Verify 300K indexed thumbnail warmup and durable-preview safety
        run: python3 scripts/test_artwork_thumbnail_warmup_sqlite.py

      - name: Verify SAF-native staging, retry and non-destructive safety
        run: python3 scripts/test_asterion_source_staging_contract.py
      - name: Verify FTS4 recovery, compact gallery and native export safety
        run: python3 scripts/test_core_gallery_fts4_recovery.py

      - name: Verify additive 15-pack Fusion taxonomy, identity and source persistence
        run: python3 scripts/test_core_knowledge_15pack_contract.py

      - name: Verify 25K growing canonical roster and indexed live taxonomy updates
        run: python3 scripts/test_core_20k_dynamic_knowledge.py

      - name: Verify unique canonical tags and full automation restart
        run: python3 scripts/test_core_full_tagging_restart.py

      - name: Verify one-pass taxonomy recognition and 300K rating/source integrity
        run: python3 scripts/test_core_one_build_300k_contract.py

      - name: Verify native startup recovery, splash continuity and gallery data safety
        run: python3 scripts/test_core_native_startup_recovery.py

      - name: Verify Organized-only gallery uses durable Fusion file receipts
        run: python3 scripts/test_core_organized_gallery_filter.py

      - name: Check multimodal native batching contract
        run: python3 scripts/test_qwen_mtmd_native_source.py

      # Single production build allowance: do not create a second disposable
      # signed release here. Android tests above are the preflight gate.

  # Unsigned RELEASE outputs are safe to publish for offline signing via the
  # user's one persistent keystore saved outside the public repository.
  # This artifact is NOT installable until its APK v2 signature is applied.
  release-unsigned:
    if: github.ref == 'refs/heads/feature/core-alternate-native-tagger-20261111' || github.ref == 'refs/heads/feature/core-fusion-native-gallery-20261108' || github.ref == 'refs/heads/fix/core-native-taxonomy-fast-cancel-20261102' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/automation-integrity-hardening-20261030' || github.ref == 'refs/heads/fix/automation-exclusive-memory-v2016-20261101' || github.ref == 'refs/heads/fix/production-automation-source-background-ai-20261102' || github.ref == 'refs/heads/fix/indexed-thumbnail-prewarm-automation-20261102' || github.ref == 'refs/heads/fix/aesthetic-admission-device-2136mib-20261102' || github.ref == 'refs/heads/fix/asterioncore-image-loading-background-and-integrity-20261102'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble verified specialist visual model into the alternate APK
        if: github.ref == 'refs/heads/feature/core-alternate-native-tagger-20261111'
        run: |
          python3 -m pip install onnx==1.19.1 onnxruntime==1.23.2
          python3 scripts/prepare_bundled_wd_vit_v3.py
          python3 scripts/prepare_bundled_anime_person_detector.py
      - name: Assemble unsigned production release for permanent-key signing
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload unsigned production artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsterionCore-UNSIGNED-production-release
          path: android_app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  # If GitHub's own signing secrets are configured, publish a signed APK too.
  # Otherwise the separate unsigned production APK can be securely signed
  # in a ChatGPT session using the persistent private Library keystore.
  signed-release:
    # Production branch signs the single unsigned artifact offline with the
    # established owner-provided key. Do not compile a second signed APK.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check permanent signing credentials
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ASTERION_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ASTERION_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ASTERION_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ASTERION_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub signing secrets are not configured. The separately built unsigned release may be signed with the same permanent user key stored securely outside GitHub. No debug APK is distributed."
          fi

      - name: Restore persistent signing key securely
        if: steps.signing.outputs.ready == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ASTERION_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/asterion-release.jks"
          test -s "$RUNNER_TEMP/asterion-release.jks"

      - name: Bundle pinned ONNX artwork model for signed alternate APK
        if: steps.signing.outputs.ready == 'true' && github.ref == 'refs/heads/feature/core-alternate-native-tagger-20261111'
        run: |
          python3 -m pip install onnx==1.19.1 onnxruntime==1.23.2
          python3 scripts/prepare_bundled_wd_vit_v3.py
          python3 scripts/prepare_bundled_anime_person_detector.py

      - name: Build stable signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android_app
        env:
          ASTERION_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/asterion-release.jks
          ASTERION_SIGNING_STORE_PASSWORD: ${{ secrets.ASTERION_SIGNING_STORE_PASSWORD }}
          ASTERION_SIGNING_KEY_ALIAS: ${{ secrets.ASTERION_SIGNING_KEY_ALIAS }}
          ASTERION_SIGNING_KEY_PASSWORD: ${{ secrets.ASTERION_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK and pinned signing identity
        if: steps.signing.outputs.ready == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ASTERION_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          apk="android_app/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "${#actual}" -eq 64
          echo "APK signing certificate SHA-256: $actual"
          # A release is NEVER update-compatible without the pinned identity.
          # This variable is the SHA-256 fingerprint of the existing signing
          # certificate (NOT its private key). Require it before publishing.
          if [[ -z "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Set GitHub Actions variable ASTERION_RELEASE_CERT_SHA256 to your existing signing certificate fingerprint. Refusing to publish an unpinned release."
            exit 1
          fi
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ASTERION_RELEASE_CERT_SHA256 must be a 64-digit SHA-256 hex fingerprint."
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The signing certificate differs from your existing update identity. Refusing to publish an incompatible APK."
            exit 1
          fi
          echo "Verified existing signing certificate: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Android package: com.ailm.android" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stable update-compatible APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AsterionCore-stable-signed-apk
          path: android_app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/asterion-release.jks"
