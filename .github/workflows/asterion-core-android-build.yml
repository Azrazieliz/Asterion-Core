name: Asterion Core Android Build

concurrency:
  group: asterion-core-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - standalone-android
      - asterion-import-pass1
      - asterion-character-resolver-v1
      - feature/roundsync-terabox-cloud-browser-20261019
      - fix/terabox-model-import-staging-20261023
      - fix/android-automation-memory-budget-20261023
      - fix/persistent-android-release-signing-20261023
      - feature/automation-300k-checkpointed-pages-20261023
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run model import regressions and build debug APK
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugUnitTestKotlin
          ./gradlew :app:testDebugUnitTest \
            --tests "com.ailm.android.runtime.ReferenceKnowledgeParserTest" \
            --tests "com.ailm.android.runtime.CanonicalAttributeSemanticsTest" \
            --tests "com.ailm.android.runtime.AutomationPathPolicyTest" \
            --tests "com.ailm.android.runtime.ContentTriagePolicyTest" \
            --tests "com.ailm.android.runtime.ImageFingerprintingTest" \
            --tests "com.ailm.android.runtime.ai.ModelPackageInspectorTest" \
            --tests "com.ailm.android.runtime.ai.ModelPackageInspectorRegressionTest" \
            --tests "com.ailm.android.runtime.ai.QwenLlamaCppContractTest" \
            --tests "com.ailm.android.runtime.ai.NomicVisionExecutionContractTest" \
            --tests "com.ailm.android.runtime.ai.AiMemoryReservationPolicyTest" \
            --tests "com.ailm.android.runtime.AutomationPagingPolicyTest" \
            --stacktrace
          ./gradlew :app:assembleDebug --stacktrace

      - name: Smoke-test release signing with a disposable CI-only key
        # Never distribute this temporary-key build. It validates the release
        # Gradle path before anyone configures their permanent signing secrets.
        if: github.ref != 'refs/heads/main'
        working-directory: android_app
        shell: bash
        env:
          ASTERION_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/asterion-ci-smoketest.jks
          ASTERION_SIGNING_STORE_PASSWORD: ci-test-password-not-for-production
          ASTERION_SIGNING_KEY_ALIAS: asterion-ci-smoketest
          ASTERION_SIGNING_KEY_PASSWORD: ci-test-password-not-for-production
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$ASTERION_SIGNING_KEYSTORE_FILE" \
            -storepass "$ASTERION_SIGNING_STORE_PASSWORD" \
            -keypass "$ASTERION_SIGNING_KEY_PASSWORD" \
            -alias "$ASTERION_SIGNING_KEY_ALIAS" \
            -dname "CN=AsterionCore CI smoke test" \
            -keyalg RSA -keysize 3072 -validity 2
          ./gradlew :app:assembleRelease --stacktrace
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify "$apk"
          rm -f "$ASTERION_SIGNING_KEYSTORE_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsterionCore-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Stable release builds are intentionally separate from disposable debug
  # artifacts. Without all four secrets, this job emits a warning and NO
  # installable "release" artifact, rather than generating another signer.
  signed-release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check permanent signing credentials
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ASTERION_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ASTERION_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ASTERION_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ASTERION_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable release signing is not configured. Set the four ASTERION_SIGNING_* GitHub Actions secrets; no signed release APK will be published."
          fi

      - name: Restore persistent signing key securely
        if: steps.signing.outputs.ready == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ASTERION_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/asterion-release.jks"
          test -s "$RUNNER_TEMP/asterion-release.jks"

      - name: Build stable signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android_app
        env:
          ASTERION_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/asterion-release.jks
          ASTERION_SIGNING_STORE_PASSWORD: ${{ secrets.ASTERION_SIGNING_STORE_PASSWORD }}
          ASTERION_SIGNING_KEY_ALIAS: ${{ secrets.ASTERION_SIGNING_KEY_ALIAS }}
          ASTERION_SIGNING_KEY_PASSWORD: ${{ secrets.ASTERION_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK and pinned signing identity
        if: steps.signing.outputs.ready == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ASTERION_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          apk="android_app/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "${#actual}" -eq 64
          echo "APK signing certificate SHA-256: $actual"
          if [[ -n "$EXPECTED_CERT_SHA256" ]]; then
            expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::The signing certificate has changed. Refusing to publish an APK that cannot update existing installations."
              exit 1
            fi
          else
            echo "::warning::Pin this certificate by creating GitHub Actions variable ASTERION_RELEASE_CERT_SHA256=$actual to prevent accidental signing key rotation."
          fi

      - name: Upload stable update-compatible APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AsterionCore-stable-signed-apk
          path: android_app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/asterion-release.jks"
