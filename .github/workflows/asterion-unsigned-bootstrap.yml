name: Bootstrap AsterionCore Unsigned Release

on:
  push:
    branches:
      - build/asterion-unsigned-release-bootstrap-20261023

jobs:
  release-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release APK for offline signing with permanent user key
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload unsigned release only (not installable until signed)
        uses: actions/upload-artifact@v4
        with:
          name: AsterionCore-2.0.6-unsigned-release
          path: android_app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
