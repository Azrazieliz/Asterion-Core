name: AsterionCore v2.0.16 unsigned production artifact
on:
  push:
    branches:
      - build/v2016-unsigned-parallel-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble unsigned APK using existing release resources and native code
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Publish unsigned artifact for permanent-key signing
        uses: actions/upload-artifact@v4
        with:
          name: AsterionCore-v2016-unsigned-artifact
          path: android_app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
