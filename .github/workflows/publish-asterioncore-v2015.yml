name: Publish AsterionCore v2.0.15 signed APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-asterioncore-v2015.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve immutable production CI APK
        uses: actions/download-artifact@v4
        with:
          name: AsterionCore-UNSIGNED-production-release
          run-id: 41354711242
          repository: Azrazieliz/Asterion-Core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Restore this build's precomputed signature and verify SHA256
        env:
          SIGNED_BLOCK_B64: 
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zipfile
          unsigned_path = pathlib.Path('dist/app-release-unsigned.apk')
          src = unsigned_path.read_bytes()
          assert hashlib.sha256(src).hexdigest() == 'cb394cee7e88ebe46ba4fd4be0467175585f737a7d8fef95eb2169e386fd71e2', 'Unsigned production artifact has changed'
          block = base64.b64decode(os.environ['SIGNED_BLOCK_B64'], validate=True)
          assert len(block) == 2008 and block[-16:] == b'APK Sig Block 42', 'Invalid exact-build signing block'
          eocd = src.rfind(b'PK\x05\x06', max(0,len(src)-65557))
          assert eocd >= 0 and eocd + 22 + int.from_bytes(src[eocd+20:eocd+22], 'little') == len(src)
          cd = int.from_bytes(src[eocd+16:eocd+20], 'little')
          size = int.from_bytes(src[eocd+12:eocd+16], 'little')
          assert cd + size == eocd, 'Unexpected APK layout'
          end = bytearray(src[eocd:])
          end[16:20] = (cd + len(block)).to_bytes(4, 'little')
          signed = src[:cd] + block + src[cd:eocd] + end
          expected = 'e2a5fe430b3edcbbc37cc0090a54b6dc5b954e96137d0a0f1d76cbc18b6cd536'
          assert hashlib.sha256(signed).hexdigest() == expected, 'Signed APK does not match the independently verified release'
          target = pathlib.Path('dist/AsterionCore-v2.0.15-STABLE-SIGNED.apk')
          target.write_bytes(signed)
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None, 'ZIP content damaged'
              assert len(archive.infolist()) == 159, 'Missing APK content'
          print('EXACT SIGNED APK VERIFIED:', target, expected, 'bytes=', len(signed))
          PY
      - name: Publish persistent GitHub release download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create asterioncore-v2.0.15 --repo Azrazieliz/Asterion-Core \
            "dist/AsterionCore-v2.0.15-STABLE-SIGNED.apk" \
            --target "$GITHUB_SHA" \
            --title "AsterionCore v2.0.15 (permanent signed Android update)" \
            --notes "Signed Android APK for in-place installation. Package com.ailm.android; versionCode 20015. Same permanent signing certificate as v2.0.10. SHA256: e2a5fe430b3edcbbc37cc0090a54b6dc5b954e96137d0a0f1d76cbc18b6cd536. GitHub Android CI passed. Executes real automation OCR/Qwen tasks directly instead of remaining queued. Preserve installed models and Artworks. Real-device inference to be verified after in-place update. Do not uninstall the existing app." \
            --latest
