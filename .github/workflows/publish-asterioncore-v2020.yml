name: Publish AsterionCore v2.0.20 signed APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-asterioncore-v2020.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable v2.0.20 Android CI release
        uses: actions/download-artifact@v4
        with:
          name: AsterionCore-UNSIGNED-production-release
          run-id: 41419436328
          repository: Azrazieliz/Asterion-Core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Restore precomputed permanent-key public signature and verify exact APK
        env:
          DIGEST_B64: D/0lurgvm95wDSzBzp26UjIc6tbnhLO/rDUGW1jWmeA=
          RSA_SIGNATURE_B64: 
        run: |
          python3 - <<'PY'
          import os, re, base64, hashlib, pathlib, zipfile
          template = pathlib.Path('.github/workflows/publish-asterioncore-v2017.yml').read_text()
          found = re.search(r'SIGNED_BLOCK_B64:\s+([A-Za-z0-9+/=]+)', template)
          assert found, 'Previous trusted public signature block is unavailable'
          block = bytearray(base64.b64decode(found.group(1), validate=True))
          assert len(block) == 2008 and block[-16:] == b'APK Sig Block 42'
          new_digest = base64.b64decode(os.environ['DIGEST_B64'], validate=True)
          new_signature = base64.b64decode(os.environ['RSA_SIGNATURE_B64'], validate=True)
          assert len(new_digest) == 32 and len(new_signature) == 384
          block[48:80] = new_digest
          block[1174:1558] = new_signature
          assert hashlib.sha256(block).hexdigest() == '3190329c3fa74452d78acfa1c8cba0f28f2667932a74703fc6bff62d349d9fd2'
          source = pathlib.Path('dist/app-release-unsigned.apk')
          content = source.read_bytes()
          assert hashlib.sha256(content).hexdigest() == '5c1481cc0cc4f08512b4d2ca85428104379572e25d22ca4297b467d5438b932b'
          eocd = content.rfind(b'PK\x05\x06', max(0, len(content)-65557))
          assert eocd >= 0 and eocd + 22 + int.from_bytes(content[eocd+20:eocd+22], 'little') == len(content)
          cd = int.from_bytes(content[eocd+16:eocd+20], 'little')
          size = int.from_bytes(content[eocd+12:eocd+16], 'little')
          assert cd + size == eocd
          patched = bytearray(content[eocd:])
          patched[16:20] = (cd + len(block)).to_bytes(4, 'little')
          signed = content[:cd] + block + content[cd:eocd] + patched
          assert hashlib.sha256(signed).hexdigest() == 'b4b1da161d08fa7d1288d027fad1bc72f7bdf2c28f71d5ee3622492209dd6dad'
          target = pathlib.Path('dist/AsterionCore-v2.0.20-STABLE-SIGNED.apk')
          target.write_bytes(signed)
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None and len(archive.infolist()) == 159
          print('Exact permanent-certificate signed APK verified:', target)
          PY
      - name: Publish permanent Android update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create asterioncore-v2.0.20 --repo Azrazieliz/Asterion-Core \
            'dist/AsterionCore-v2.0.20-STABLE-SIGNED.apk' \
            --target "$GITHUB_SHA" \
            --title 'AsterionCore v2.0.20 (permanent signed Android update)' \
            --notes 'Asterion Core v2.0.20 — Android 17 device-observed 0/14,528 aesthetic scoring admission correction, bounded concurrent background thumbnail warmup and privacy-safe ADB automation diagnostics. GitHub compile, 300K gallery-paging and AI admission regressions passed. Package com.ailm.android, versionCode 20020. Exact APK SHA256 b4b1da161d08fa7d1288d027fad1bc72f7bdf2c28f71d5ee3622492209dd6dad. Same permanent signing certificate as previous releases; install over existing without uninstalling or clearing data. Full multi-model automation completion has NOT been verified in an on-device run. No need to repeat user-initiated tests until that validation is planned.' \
            --latest
