name: Publish AsterionCore v2.0.24 signed APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-asterioncore-v2024.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable v2.0.24 Android CI release
        uses: actions/download-artifact@v4
        with:
          name: AsterionCore-UNSIGNED-production-release
          run-id: 41475260607
          repository: Azrazieliz/Asterion-Core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Restore precomputed permanent-key public signature and verify exact APK
        env:
          DIGEST_B64: 2eIm50d451/H94JVWsYiUd4uNo2UpQkh3pLAx76UQtU=
          RSA_SIGNATURE_B64: 
        run: |
          python3 - <<'PY'
          import os, re, base64, hashlib, pathlib, zipfile
          template = pathlib.Path('.github/workflows/publish-asterioncore-v2017.yml').read_text()
          found = re.search(r'SIGNED_BLOCK_B64:\s+([A-Za-z0-9+/=]+)', template)
          assert found, 'Previous trusted public signature block is unavailable'
          block = bytearray(base64.b64decode(found.group(1), validate=True))
          assert len(block) == 2008 and block[-16:] == b'APK Sig Block 42'
          new_digest = base64.b64decode(os.environ['DIGEST_B64'], validate=True)
          new_signature = base64.b64decode(os.environ['RSA_SIGNATURE_B64'], validate=True)
          assert len(new_digest) == 32 and len(new_signature) == 384
          block[48:80] = new_digest
          block[1174:1558] = new_signature
          assert hashlib.sha256(block).hexdigest() == '065f17c89542d1cbfd1980d759995765bb78636f18c44abcc9489f442c701d4c'
          source = pathlib.Path('dist/app-release-unsigned.apk')
          content = source.read_bytes()
          assert hashlib.sha256(content).hexdigest() == '917670df0c23301cd668b3b136e779de7d43f04c6c83f7ce69fd0b3696dacf15'
          eocd = content.rfind(b'PK\x05\x06', max(0, len(content)-65557))
          assert eocd >= 0 and eocd + 22 + int.from_bytes(content[eocd+20:eocd+22], 'little') == len(content)
          cd = int.from_bytes(content[eocd+16:eocd+20], 'little')
          size = int.from_bytes(content[eocd+12:eocd+16], 'little')
          assert cd + size == eocd
          patched = bytearray(content[eocd:])
          patched[16:20] = (cd + len(block)).to_bytes(4, 'little')
          signed = content[:cd] + block + content[cd:eocd] + patched
          assert hashlib.sha256(signed).hexdigest() == 'fe2f27be7db8a9ac55ea850f5fcab7e9a53300376074d0560cea21baf74a8d96'
          target = pathlib.Path('dist/AsterionCore-v2.0.24-STABLE-SIGNED.apk')
          target.write_bytes(signed)
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None and len(archive.infolist()) == 159
          print('Exact permanent-certificate signed APK verified:', target)
          PY
      - name: Publish permanent Android update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create asterioncore-v2.0.24 --repo Azrazieliz/Asterion-Core \
            'dist/AsterionCore-v2.0.24-STABLE-SIGNED.apk' \
            --target "$GITHUB_SHA" \
            --title 'AsterionCore v2.0.24 (permanent signed Android update)' \
            --notes 'Asterion Core v2.0.24: reduce native Qwen structured-JSON latency and KV memory pressure, replace costly automatic diagnostics polling with lightweight heartbeat and add safe clear-finished-diagnostics. In-place update preserves existing catalog, models, and source files. Device throughput remains to be verified. SHA-256 fe2f27be7db8a9ac55ea850f5fcab7e9a53300376074d0560cea21baf74a8d96.' \
            --latest
